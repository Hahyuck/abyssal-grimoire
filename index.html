<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>ABYSSAL GRIMOIRE</title><style>*{box-sizing:border-box}html,body{margin:0;background:#08070d;color:#f4e3bd;font-family:monospace;overflow:hidden;touch-action:none}#shell{height:100dvh;display:flex;align-items:center;justify-content:center;flex-direction:column}canvas{width:min(100vw,calc(100dvh * 4 / 3));aspect-ratio:4/3;image-rendering:pixelated;background:#16111d;touch-action:none}#controls{display:none}button{border:2px solid #b7a07b;background:#292132;color:#fff0c6;font:bold 15px monospace;border-radius:10px;touch-action:none}#info{font-size:12px;padding:4px;text-align:center}@media(pointer:coarse){canvas{width:min(100vw,calc(100dvh * 3 / 4));aspect-ratio:3/4}#controls{display:flex;width:min(100vw,480px);height:112px;gap:8px;padding:5px;justify-content:space-between}#move{width:40%;border:2px solid #817087;border-radius:50%;position:relative;background:#191323}#nub{position:absolute;left:calc(50% - 20px);top:calc(50% - 20px);width:40px;height:40px;background:#75647e;border-radius:50%}#actions{display:grid;grid-template-columns:1fr 1fr;gap:5px;flex:1}#info{display:none}}@media(pointer:coarse) and (max-height:720px){#controls{height:88px}}</style></head><body><div id="shell"><canvas id="game" width="640" height="480"></canvas><div id="controls"><div id="move"><div id="nub"></div></div><div id="actions"><button id="fire">FIRE</button><button id="reload">RELOAD</button><button id="swap">WEAPON</button><button id="use">USE</button></div></div><div id="info">WASD MOVE · MOUSE LOOK · CLICK FIRE · R RELOAD · 1/2/3 WEAPONS</div></div><script>
const c=document.querySelector('canvas'),g=c.getContext('2d');g.imageSmoothingEnabled=false;
const map=['111111111111','100000000001','101110011101','100010000001','100010110001','100000000001','101100011101','100000000001','100011000001','100000000001','111111111111'];
const p={x:2.5,y:2.5,a:0,hp:100,ammo:8,max:8,w:0,kills:0},enemies=[{x:8.5,y:3.5,hp:3},{x:9.5,y:8.5,hp:3},{x:4.5,y:7.5,hp:3},{x:6.5,y:5.5,hp:3}];let keys={},joy={x:0,y:0},firing=false,flash=0,shake=0,msg='ENTER THE ABYSS',last=performance.now(),cool=0,shot=0;
const wall=(x,y)=>map[Math.floor(y)]?.[Math.floor(x)]!=='0',move=(dx,dy)=>{if(!wall(p.x+dx*.35,p.y))p.x+=dx;if(!wall(p.x,p.y+dy*.35))p.y+=dy};
function fire(){if(cool>0)return;cool=p.w===1?.18:.38;if(p.w===0&&p.ammo<=0){msg='PRESS RELOAD';return}if(p.w===0)p.ammo--;flash=.13;shake=9;shot++;let target=null,best=1e3;for(const e of enemies){if(e.hp<=0)continue;let d=Math.hypot(e.x-p.x,e.y-p.y),da=Math.atan2(e.y-p.y,e.x-p.x)-p.a;da=Math.atan2(Math.sin(da),Math.cos(da));if(Math.abs(da)<.17+0.1/d&&d<best){let blocked=false;for(let t=.15;t<d;t+=.12)if(wall(p.x+Math.cos(p.a+da)*t,p.y+Math.sin(p.a+da)*t)){blocked=true;break}if(!blocked){target=e;best=d}}}if(target){target.hp-=p.w===2?2:1;if(target.hp<=0){p.kills++;msg='DEMON BANISHED'}}}
function reload(){if(p.w===0){p.ammo=p.max;msg='ARCANE SHELLS LOADED';cool=.6}}
function weapon(){p.w=(p.w+1)%3;msg=['RUNEBREAKER','HEX BOLTER','INFERNO GRIMOIRE'][p.w]}
document.addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyR')reload();if(e.code==='Digit1')p.w=0;if(e.code==='Digit2')p.w=1;if(e.code==='Digit3')p.w=2;if(e.code==='Space')fire()});document.addEventListener('keyup',e=>keys[e.code]=false);c.addEventListener('click',()=>{if(matchMedia('(pointer:fine)').matches)c.requestPointerLock?.();fire()});document.addEventListener('mousemove',e=>{if(document.pointerLockElement===c)p.a+=e.movementX*.003});let touchLook=null;c.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'){touchLook=e.pointerId;c.setPointerCapture(e.pointerId);c._lx=e.clientX}});c.addEventListener('pointermove',e=>{if(e.pointerId===touchLook){p.a+=(e.clientX-c._lx)*.008;c._lx=e.clientX}});c.addEventListener('pointerup',e=>{if(e.pointerId===touchLook)touchLook=null});
const pad=document.querySelector('#move'),nub=document.querySelector('#nub');function setJoy(e){const r=pad.getBoundingClientRect(),dx=(e.clientX-r.left-r.width/2)/(r.width*.38),dy=(e.clientY-r.top-r.height/2)/(r.height*.38),m=Math.max(1,Math.hypot(dx,dy));joy={x:dx/m,y:dy/m};nub.style.transform='translate('+joy.x*25+'px,'+joy.y*25+'px)'}pad.addEventListener('pointerdown',e=>{pad.setPointerCapture(e.pointerId);setJoy(e)});pad.addEventListener('pointermove',e=>{if(pad.hasPointerCapture(e.pointerId))setJoy(e)});function resetJoy(){joy={x:0,y:0};nub.style.transform=''}pad.addEventListener('pointerup',resetJoy);pad.addEventListener('pointercancel',resetJoy);document.querySelector('#fire').addEventListener('pointerdown',e=>{e.preventDefault();firing=true;fire()});for(const ev of ['pointerup','pointercancel'])document.querySelector('#fire').addEventListener(ev,()=>firing=false);document.querySelector('#reload').onclick=reload;document.querySelector('#swap').onclick=weapon;document.querySelector('#use').onclick=()=>{msg='THE GATES ARE SEALED'};
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;cool=Math.max(0,cool-dt);flash=Math.max(0,flash-dt);shake=Math.max(0,shake-dt*40);if(firing&&cool===0)fire();if(keys.ArrowLeft)p.a-=dt*2.4;if(keys.ArrowRight)p.a+=dt*2.4;let f=(keys.KeyW?1:0)-(keys.KeyS?1:0)-joy.y,s=(keys.KeyD?1:0)-(keys.KeyA?1:0)+joy.x,sp=dt*2.4;move((Math.cos(p.a)*f-Math.sin(p.a)*s)*sp,(Math.sin(p.a)*f+Math.cos(p.a)*s)*sp);
for(const e of enemies)if(e.hp>0){let d=Math.hypot(e.x-p.x,e.y-p.y);if(d<5&&d>.8){let vx=(p.x-e.x)/d*.32*dt,vy=(p.y-e.y)/d*.32*dt;if(!wall(e.x+vx,e.y))e.x+=vx;if(!wall(e.x,e.y+vy))e.y+=vy}if(d<.8)p.hp=Math.max(0,p.hp-dt*12)}
const W=c.width,H=c.height,horizon=H*.46;g.fillStyle='#241a31';g.fillRect(0,0,W,horizon);g.fillStyle='#352b2d';g.fillRect(0,horizon,W,H-horizon);for(let y=horizon;y<H;y+=9){g.fillStyle='rgba(0,0,0,.08)';g.fillRect(0,y,W,2)}
const depth=[];for(let x=0;x<W;x+=2){let ray=p.a+Math.atan((x/W-.5)*1.25),dx=Math.cos(ray),dy=Math.sin(ray),dist=.02;while(dist<20&&!wall(p.x+dx*dist,p.y+dy*dist))dist+=.035;let corrected=dist*Math.cos(ray-p.a),height=Math.min(H*2,H/(corrected*.8)),wx=p.x+dx*dist,wy=p.y+dy*dist,edge=Math.min(wx%1,wy%1,1-wx%1,1-wy%1);let v=Math.max(25,150-dist*13-(edge<.07?32:0));g.fillStyle='rgb('+Math.floor(v*.62)+','+Math.floor(v*.49)+','+Math.floor(v*.68)+')';g.fillRect(x,horizon-height/2,2,height);if(Math.floor((wx+wy)*3)%3===0){g.fillStyle='rgba(0,0,0,.13)';g.fillRect(x,horizon-height/2+height*.4,2,3)}depth[x/2]=dist}
for(const e of enemies.filter(e=>e.hp>0).sort((a,b)=>Math.hypot(b.x-p.x,b.y-p.y)-Math.hypot(a.x-p.x,a.y-p.y))){let d=Math.hypot(e.x-p.x,e.y-p.y),a=Math.atan2(e.y-p.y,e.x-p.x)-p.a;a=Math.atan2(Math.sin(a),Math.cos(a));let sx=W/2+Math.tan(a)*W*.8,sz=Math.min(H,H/d*.65);if(Math.abs(a)<.8&&d<depth[Math.max(0,Math.min(depth.length-1,Math.floor(sx/2)))] +.2){g.fillStyle='#201323';g.fillRect(sx-sz*.24,horizon-sz*.4,sz*.48,sz*.82);g.fillStyle='#9d3755';g.fillRect(sx-sz*.18,horizon-sz*.35,sz*.36,sz*.52);g.fillStyle='#f7c36b';g.fillRect(sx-sz*.12,horizon-sz*.22,sz*.07,sz*.05);g.fillRect(sx+sz*.05,horizon-sz*.22,sz*.07,sz*.05);g.fillStyle='#d7b0a3';g.fillRect(sx-sz*.21,horizon-sz*.4,sz*.1,sz*.16);g.fillRect(sx+sz*.11,horizon-sz*.4,sz*.1,sz*.16)}}
let bx=W/2+Math.sin(now/240)*2,by=H-28+Math.cos(now/210)*2;g.fillStyle='#140e1c';g.fillRect(bx-65,by-130,130,160);g.fillStyle=p.w===2?'#6b315c':'#6e6272';g.fillRect(bx-43,by-140,86,145);g.fillStyle=p.w===2?'#ee8146':'#bba37d';g.fillRect(bx-18,by-160,36,115);g.fillStyle='#27212a';g.fillRect(bx-13,by-165,26,42);g.fillStyle='#c4ad85';g.fillRect(bx-50,by-20,100,12);if(flash){g.fillStyle=p.w===2?'#ff692d':'#fce8a5';g.beginPath();g.moveTo(bx,by-205);g.lineTo(bx-35,by-157);g.lineTo(bx,by-172);g.lineTo(bx+35,by-157);g.fill()}
g.strokeStyle='#e8d1a0';g.lineWidth=2;g.beginPath();g.moveTo(W/2-8,horizon);g.lineTo(W/2-3,horizon);g.moveTo(W/2+3,horizon);g.lineTo(W/2+8,horizon);g.moveTo(W/2,horizon-8);g.lineTo(W/2,horizon-3);g.moveTo(W/2,horizon+3);g.lineTo(W/2,horizon+8);g.stroke();
g.fillStyle='#15101d';g.fillRect(0,H-45,W,45);g.fillStyle='#d7b67c';g.font='bold 18px monospace';g.fillText('HP '+Math.ceil(p.hp),12,H-16);g.fillText(['SHELL '+p.ammo+'/8','HEX ∞','FIRE ∞'][p.w],W*.38,H-16);g.fillText('KILLS '+p.kills+'/4',W-132,H-16);g.font='bold 15px monospace';g.fillText(p.hp<=0?'YOU HAVE FALLEN':p.kills===4?'ABYSS CLEARED':msg,12,26);if(p.hp<=0){p.hp=100;p.x=2.5;p.y=2.5;p.kills=0;enemies.forEach(e=>e.hp=3)}requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
